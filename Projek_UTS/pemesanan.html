<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan - Ayam Geybok Bang Jarwo</title>

    <link rel="icon" href="image/logo.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header>
        <div class="logo">
            <img src="image/logo.jpg" alt="Logo UMKM">
        </div>

        <nav>
            <a href="index.html">HOME</a>
            <a href="produk.html">PRODUK</a>

            <div class="dropdown">
                <span class="dropdown-toggle" tabindex="0">INFORMASI ▼</span>

                <div class="dropdown-content">
                    <a href="index.html#produk-unggulan">PRODUK UNGGULAN</a>
                    <a href="index.html#lokasi">LOKASI</a>
                    <a href="pemesanan.html">PEMESANAN</a>
                </div>
            </div>
        </nav>
    </header>


    <!-- FORM PEMESANAN -->
    <section class="order">
        <div class="order-wrap">

            <div class="order-header">
                <h2>Form Pemesanan</h2>
                <p>Isi data di bawah untuk melakukan pemesanan.</p>
            </div>

            <div class="order-container">

                <!-- GANTI action="#" dengan tujuan pengiriman form (mis. Formspree / mailto) -->
                <form onsubmit="event.preventDefault(); this.reset();">


                    <!-- NAMA -->
                    <label for="nama">Nama<span class="req">*</span></label>
                    <input type="text" id="nama" name="nama"
                        placeholder="Masukkan nama" autocomplete="name" required>

                    <!-- NOMOR HP -->
                    <label for="nomor">Nomor HP<span class="req">*</span></label>
                    <input type="tel" id="nomor" name="nomor"
                        placeholder="08xxxxxxxxxx" inputmode="numeric"
                        autocomplete="tel" pattern="(\+62|62|0)8[0-9]{8,12}"
                        title="Contoh: 081234567890" required>

                    <!-- PRODUK -->
                    <label for="produk">Pilih Produk<span class="req">*</span></label>
                    <select id="produk" name="produk" required>
                    <option value="" disabled selected>Pilih menu</option>
                    <optgroup label="Paket Promo">
                        <option value="Paket Promo Happy 1" data-harga="29000">Paket Promo Happy 1 - Rp 29.000</option>
                        <option value="Paket Promo Happy 2" data-harga="29000">Paket Promo Happy 2 - Rp 29.000</option>
                        <option value="Paket Promo Happy 3" data-harga="29000">Paket Promo Happy 3 - Rp 29.000</option>
                        <option value="Paket Promo Semua Kenyang" data-harga="109000">Paket Promo Semua Kenyang - Rp 109.000</option>
                        <option value="Paket Promo Ber-2 Puas" data-harga="52000">Paket Promo Ber-2 Puas - Rp 52.000</option>
                        <option value="Paket Promo Ber-2 Nikmat" data-harga="52000">Paket Promo Ber-2 Nikmat - Rp 52.000</option>
                        <option value="Paket Promo Ceria 1" data-harga="29000">Paket Promo Ceria 1 - Rp 29.000</option>
                        <option value="Paket Promo Ceria 2" data-harga="25000">Paket Promo Ceria 2 - Rp 25.000</option>
                    </optgroup>
                    <optgroup label="Paket Nasi">
                        <option value="Paket Ayam Geybok 1" data-harga="23000">Paket Ayam Geybok 1 - Rp 23.000</option>
                        <option value="Paket Ayam Blonde" data-harga="23000">Paket Ayam Blonde - Rp 23.000</option>
                        <option value="Paket Ayam Kriuk" data-harga="19000">Paket Ayam Kriuk - Rp 19.000</option>
                        <option value="Paket Ayam Geybok 2" data-harga="24000">Paket Ayam Geybok 2 - Rp 24.000</option>
                        <option value="Paket Empal Geybok 3" data-harga="23000">Paket Empal Geybok 3 - Rp 23.000</option>
                        <option value="Paket Empal Geybok 4" data-harga="24000">Paket Empal Geybok 4 - Rp 24.000</option>
                        <option value="Paket Ayam Blonkrik" data-harga="23000">Paket Ayam Blonkrik - Rp 23.000</option>
                    </optgroup>
                    <optgroup label="Ayam Satuan">
                        <option value="Ayam Geybok" data-harga="18000">Ayam Geybok - Rp 18.000</option>
                        <option value="Empal Geybok" data-harga="18000">Empal Geybok - Rp 18.000</option>
                        <option value="Ayam Blonde" data-harga="19000">Ayam Blonde - Rp 19.000</option>
                        <option value="Ayam Kriuk" data-harga="15000">Ayam Kriuk - Rp 15.000</option>
                        <option value="Ayam Blonkrik" data-harga="19000">Ayam Blonkrik - Rp 19.000</option>
                    </optgroup>
                    <optgroup label="Tambahan">
                        <option value="Nasi Putih" data-harga="5000">Nasi Putih - Rp 5.000</option>
                        <option value="Nasi Uduk" data-harga="7000">Nasi Uduk - Rp 7.000</option>
                        <option value="Sayur Asem" data-harga="5000">Sayur Asem - Rp 5.000</option>
                        <option value="Tempe" data-harga="2500">Tempe - Rp 2.500</option>
                        <option value="Tahu" data-harga="2500">Tahu - Rp 2.500</option>
                        <option value="Telur Dadar" data-harga="5000">Telur Dadar - Rp 5.000</option>
                        <option value="Sate Kulit" data-harga="4000">Sate Kulit - Rp 4.000</option>
                        <option value="Sate Ati Ampela" data-harga="5000">Sate Ati Ampela - Rp 5.000</option>
                        <option value="Kerupuk" data-harga="3000">Kerupuk - Rp 3.000</option>
                        <option value="Sate Usus" data-harga="4000">Sate Usus - Rp 4.000</option>
                        <option value="Ikan Piyik Geybok" data-harga="10000">Ikan Piyik Geybok - Rp 10.000</option>
                        <option value="Jengkol Goreng" data-harga="6000">Jengkol Goreng - Rp 6.000</option>
                        <option value="Jengkol Semur" data-harga="6000">Jengkol Semur - Rp 6.000</option>
                        <option value="Pete" data-harga="8000">Pete - Rp 8.000</option>
                        <option value="Terong Goreng" data-harga="5000">Terong Goreng - Rp 5.000</option>
                        <option value="Kol Goreng" data-harga="5000">Kol Goreng - Rp 5.000</option>
                        <option value="Keju" data-harga="5000">Keju - Rp 5.000</option>
                    </optgroup>
                    <optgroup label="Minuman">
                        <option value="Es Tekit (Teh Jeruk Sonkit)" data-harga="8000">Es Tekit (Teh Jeruk Sonkit) - Rp 8.000</option>
                        <option value="Es Teh Tawar" data-harga="3000">Es Teh Tawar - Rp 3.000</option>
                        <option value="Teh Pucuk" data-harga="5000">Teh Pucuk - Rp 5.000</option>
                        <option value="Air Mineral Botol" data-harga="5000">Air Mineral Botol - Rp 5.000</option>
                        <option value="Cincau Madu" data-harga="2000">Cincau Madu - Rp 2.000</option>
                        <option value="Teh Tawar" data-harga="2000">Teh Tawar - Rp 2.000</option>
                        <option value="Teh Botol / S-Tee" data-harga="5000">Teh Botol / S-Tee - Rp 5.000</option>
                    </optgroup>
                    </select>

                    <!-- JUMLAH -->
                    <label for="jumlah">Jumlah<span class="req">*</span></label>
                    <input type="number" id="jumlah" name="jumlah"
                        value="1" min="1" max="99" inputmode="numeric" required>

                    <!-- CATATAN -->
                    <label for="catatan">Catatan</label>
                    <textarea id="catatan" name="catatan"
                        placeholder="Tambahkan catatan pesanan..."></textarea>

                    <!-- PEMBAYARAN -->
                    <fieldset>
                        <legend>Metode Pembayaran<span class="req">*</span></legend>

                        <div class="payment">
                            <label class="payment-option">
                                <input type="radio" name="payment" value="QRIS" required>
                                QRIS
                            </label>

                            <label class="payment-option">
                                <input type="radio" name="payment" value="Cash">
                                Cash
                            </label>

                            <label class="payment-option">
                                <input type="radio" name="payment" value="Debit">
                                Debit
                            </label>
                        </div>
                    </fieldset>

                    <!-- SUBMIT -->
                    <button type="submit">SUBMIT</button>

                    <small>
                        * Wajib diisi. Pastikan data pesanan sudah benar
                        sebelum menekan Submit.
                    </small>

                </form>

            </div>
        </div>
    </section>


    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <h3>AYAM GEYBOK BANG JARWO</h3>
            <p>Kuliner ayam dengan cita rasa khas dan harga terjangkau.</p>

            <div class="social">
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
                <a href="#" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </footer>

</div>


</body>
</html>
